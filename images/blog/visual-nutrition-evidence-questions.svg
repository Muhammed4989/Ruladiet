<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title desc"><title id="title">كيف تميّزين المعلومات الغذائية الموثوقة؟ دليل عملي</title><desc id="desc">ما الفائدة وحدودها؟، هل توجد بدائل؟، هل تناسب ظروفي؟</desc><rect width="740" height="420" rx="24" fill="#eef3ed"/><g transform="translate(38 23) scale(.85)" fill="none" stroke="#2d5240" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="48" height="52" rx="8"/><path d="m19 32 9 9 18-20"/></g><text x="688" y="64" direction="rtl" text-anchor="start" font-family="Tajawal,Arial,sans-serif" font-size="32" font-weight="bold" fill="#213e31">أسئلة قبل تطبيق النصيحة</text><g font-family="Tajawal,Arial,sans-serif"><rect x="26" y="110" width="688" height="80" rx="16" fill="white"/><circle cx="663" cy="150" r="24" fill="#2d5240"/><text x="663" y="160" text-anchor="middle" fill="white" font-size="28">١</text><text x="608" y="161" direction="rtl" text-anchor="start" fill="#213e31" font-size="32">ما الفائدة وحدودها؟</text><rect x="26" y="208" width="688" height="80" rx="16" fill="white"/><circle cx="663" cy="248" r="24" fill="#2d5240"/><text x="663" y="258" text-anchor="middle" fill="white" font-size="28">٢</text><text x="608" y="259" direction="rtl" text-anchor="start" fill="#213e31" font-size="32">هل توجد بدائل؟</text><rect x="26" y="306" width="688" height="80" rx="16" fill="white"/><circle cx="663" cy="346" r="24" fill="#2d5240"/><text x="663" y="356" text-anchor="middle" fill="white" font-size="28">٣</text><text x="608" y="357" direction="rtl" text-anchor="start" fill="#213e31" font-size="32">هل تناسب ظروفي؟</text></g></svg>