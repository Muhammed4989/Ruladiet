<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#f7f9f5;color:#1a2e24;display:flex;align-items:center;justify-content:center;padding:40px 20px;min-height:100vh}
.card{background:#fff;border-radius:20px;border:1px solid #d4e3d9;padding:48px 40px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(45,82,64,.08)}
.icon{width:72px;height:72px;background:#e8f5ee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon svg{width:36px;height:36px;color:#2d5240}
h1{font-size:1.6rem;font-weight:800;color:#1a2e24;margin-bottom:8px}
p{font-size:.95rem;color:#4a6b5a;line-height:1.7;margin-bottom:8px}
.badge{display:inline-block;background:#e8f5ee;color:#2d5240;padding:6px 20px;border-radius:20px;font-size:.82rem;font-weight:600;margin:16px 0 24px}
.divider{height:1px;background:#e8f5ee;margin:24px 0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:right}
.info-item{padding:12px 16px;background:#f7f9f5;border-radius:10px}
.info-item .label{font-size:.78rem;color:#8ba69a;font-weight:500}
.info-item .value{font-size:.92rem;color:#1a2e24;font-weight:600;margin-top:2px}
.btn{display:inline-block;padding:14px 36px;background:#2d5240;color:#fff;border-radius:50px;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .3s;margin-top:24px}
.btn:hover{background:#1f3a2d;transform:translateY(-2px)}
.note{font-size:.82rem;color:#8ba69a;margin-top:16px}
.note a{color:#4a6b5a;text-decoration:underline}
@media(max-width:480px){.card{padding:32px 24px}.info-grid{grid-template-columns:1fr}}
</style>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
  </div>
  <h1>تم الشراء بنجاح!</h1>
  <p>شكراً لاشتراكك في رولا دايت. سنرسل لك بيانات الدخول إلى الدورة على بريدك الإلكتروني خلال دقائق.</p>
  <div class="badge">تأكيد الطلب #<span id="orderNum">RULA-XXXX</span></div>
  <div class="divider"></div>
  <div class="info-grid">
    <div class="info-item">
      <div class="label">تم الإرسال إلى</div>
      <div class="value" id="customerEmail">بريدك الإلكتروني</div>
    </div>
    <div class="info-item">
      <div class="label">تاريخ الشراء</div>
      <div class="value" id="purchaseDate">اليوم</div>
    </div>
  </div>
  <a href="https://ruladiet.com/الدورات" class="btn">العودة إلى الدورات</a>
  <div class="note">لم تصلك الرسالة؟ تحقق من البريد المزعج أو <a href="https://wa.me/905300222468">تواصل معنا</a></div>
</div>

<script>
document.getElementById('orderNum').textContent = 'RULA-' + Math.random().toString(36).substring(2,6).toUpperCase();
var d = new Date();
document.getElementById('purchaseDate').textContent = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
var email = new URLSearchParams(window.location.search).get('email');
if (email) document.getElementById('customerEmail').textContent = email;
</script>
